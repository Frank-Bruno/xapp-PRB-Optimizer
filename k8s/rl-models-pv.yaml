apiVersion: v1
kind: PersistentVolume
metadata:
  name: rl-models-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/pv-ricxapp-rl-models
    type: DirectoryOrCreate
